name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Fast feedback: the domain, persistence and ViewModel layers reference no MAUI workload, so
  # they build and test in well under a minute. Run on both OSes because "Core runs anywhere" is
  # a design goal - and because the SQLite tests exercise a native library that differs per
  # platform. Presentation is here too: it targets plain net10.0 with only CommunityToolkit.Mvvm,
  # and its tests sat unrun by CI for as long as the job listed only Core and Data.
  domain:
    name: Domain, data & ViewModels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # One project per invocation: MSBuild takes a single project or solution argument and
      # rejects the second as an unknown switch (MSB1008). Restoring the solution instead is not
      # an option here - that would pull in the MAUI head, whose workloads this job does not
      # install on purpose.
      - name: Restore
        run: |
          dotnet restore tests/Squarebuzz.Core.Tests/Squarebuzz.Core.Tests.csproj
          dotnet restore tests/Squarebuzz.Data.Tests/Squarebuzz.Data.Tests.csproj
          dotnet restore tests/Squarebuzz.Presentation.Tests/Squarebuzz.Presentation.Tests.csproj

      - name: Build
        run: |
          dotnet build src/Squarebuzz.Core/Squarebuzz.Core.csproj -c Release --no-restore
          dotnet build src/Squarebuzz.Data/Squarebuzz.Data.csproj -c Release --no-restore
          dotnet build src/Squarebuzz.Presentation/Squarebuzz.Presentation.csproj -c Release --no-restore

      - name: Test
        run: |
          dotnet test tests/Squarebuzz.Core.Tests/Squarebuzz.Core.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=core.trx" --results-directory artifacts/test-results
          dotnet test tests/Squarebuzz.Data.Tests/Squarebuzz.Data.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=data.trx" --results-directory artifacts/test-results
          dotnet test tests/Squarebuzz.Presentation.Tests/Squarebuzz.Presentation.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=presentation.trx" --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results
          if-no-files-found: ignore

  # The two invariants the content depends on, enforced rather than hoped for. Both tools
  # existed and both passed, but nothing ran them: a content edit could ship a puzzle that needs
  # guessing, or a translation missing a key that then leaks raw into the UI in that language.
  # check-strings' own header says it enforces "what nothing previously enforced" - this is the
  # job that makes that true. File-based apps (`dotnet run file.cs`) need no project or restore.
  content:
    name: Content
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Translations match the neutral culture
        run: dotnet run tools/check-strings.cs

      - name: Every authored puzzle solves by pure line logic
        run: dotnet run tools/validate-puzzles.cs

  android:
    name: Android
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The runner ships MAUI workloads, but not necessarily matching this SDK band, so they are
      # installed explicitly. Only the Android ones are needed for this job.
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --skip-sign-check

      # TargetFrameworks is overridden rather than passing -f, because restore covers every
      # framework a project declares regardless of which one is being built. With the four in
      # Squarebuzz.App.csproj that means restore alone would demand the iOS, Mac Catalyst and
      # Windows workloads this job deliberately does not install, and fail with NETSDK1147.
      # A command-line property is global, so the csproj cannot append Windows back onto it.
      - name: Build APK
        run: >
          dotnet build src/Squarebuzz.App/Squarebuzz.App.csproj
          -c Release
          -p:SquarebuzzTargetFramework=net10.0-android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src/Squarebuzz.App/bin/Release/net10.0-android/*-Signed.apk
          if-no-files-found: warn

  ios:
    name: iOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Choosing an Xcode here needs two things to be true at once, and the runner image does not
      # make either obvious:
      #
      #  * The .NET for iOS pack refuses an Xcode older than the one it was built for. The first
      #    run failed with "requires Xcode 26.6, the current version of Xcode is 26.5" - and 26.5
      #    is the image *default*, with 26.6 installed alongside it.
      #  * Merely selecting the newest one is not enough either. The second run got further and then
      #    failed in actool: "SDK .../MacOSX.sdk cannot be located". A non-default Xcode has not had
      #    its first-launch component install run, so xcodebuild cannot resolve its SDKs yet.
      #
      # So rather than encode a version or an assumption, try each Xcode newest-first and keep the
      # first one whose toolchain actually resolves the macOS SDK and actool - which is precisely
      # what the build later needs. Real bundles only: the image also ships symlinks such as
      # Xcode_26.6.0.app pointing at Xcode_26.6.app, and selecting through those adds nothing.
      - name: Select a working Xcode
        run: |
          echo "Xcode bundles on this runner:"
          ls -d /Applications/Xcode*.app

          candidates="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' -type d \
            | sed -E 's#.*/Xcode_(.+)\.app#\1#' \
            | sort -t. -k1,1nr -k2,2nr -k3,3nr)"    # per-key nr: a trailing -r does not reverse a keyed sort

          chosen=""
          for version in $candidates; do
            echo "--- trying Xcode $version"
            sudo xcode-select -s "/Applications/Xcode_${version}.app" || continue

            # Idempotent, and the step a non-default Xcode is missing.
            sudo xcodebuild -runFirstLaunch || true

            if xcrun --sdk macosx --find actool >/dev/null 2>&1; then
              echo "--- Xcode $version can resolve the macOS SDK and actool"
              chosen="$version"
              break
            fi

            echo "--- Xcode $version cannot resolve actool; trying the next one"
          done

          if [ -z "$chosen" ]; then
            echo "No installed Xcode could resolve actool. Versions tried: $candidates"
            exit 1
          fi

          echo "Using Xcode $chosen"
          xcodebuild -version
          xcrun --sdk macosx --find actool

      - name: Install MAUI iOS workload
        run: dotnet workload install maui-ios --skip-sign-check

      # This job exists because iOS cannot be built on the Windows dev machine - it needs a Mac
      # with Xcode. Without it, an iOS-only break would go unnoticed until release. No signing
      # identity is available on a public runner, so the simulator target is built instead: it
      # compiles and links the real thing without needing a provisioning profile.
      - name: Build for iOS simulator
        run: >
          dotnet build src/Squarebuzz.App/Squarebuzz.App.csproj
          -c Release
          -p:SquarebuzzTargetFramework=net10.0-ios
          -p:RuntimeIdentifier=iossimulator-arm64
          -p:CodesignRequireProvisioningProfile=false

  # Analysers run as errors in Core and Data, so a warning there already fails those jobs. This
  # catches anything the MAUI head reports, which is built with warnings-as-errors relaxed.
  app-warnings:
    name: App warnings
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows --skip-sign-check

      - name: Build with warnings as errors
        run: >
          dotnet build src/Squarebuzz.App/Squarebuzz.App.csproj
          -c Release
          -p:SquarebuzzTargetFramework=net10.0-windows10.0.19041.0
          -warnaserror
