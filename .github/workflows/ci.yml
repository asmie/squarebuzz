name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Core, Data and Presentation tests on both supported host operating systems.
  domain:
    name: Domain, data & ViewModels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # These projects target plain net10.0; they do not need workload-set metadata or MAUI packs.
    env:
      MSBuildEnableWorkloadResolver: 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      # Restore test projects separately so this job does not require MAUI workloads.
      - name: Restore
        run: |
          dotnet restore tests/Squarebuzz.Core.Tests/Squarebuzz.Core.Tests.csproj
          dotnet restore tests/Squarebuzz.Data.Tests/Squarebuzz.Data.Tests.csproj
          dotnet restore tests/Squarebuzz.Presentation.Tests/Squarebuzz.Presentation.Tests.csproj

      - name: Build
        run: |
          dotnet build src/Squarebuzz.Core/Squarebuzz.Core.csproj -c Release --no-restore
          dotnet build src/Squarebuzz.Data/Squarebuzz.Data.csproj -c Release --no-restore
          dotnet build src/Squarebuzz.Presentation/Squarebuzz.Presentation.csproj -c Release --no-restore

      - name: Test Core
        run: >
          dotnet test tests/Squarebuzz.Core.Tests/Squarebuzz.Core.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=core.trx" --results-directory artifacts/test-results -- RunConfiguration.TreatNoTestsAsError=true

      - name: Test Data
        run: >
          dotnet test tests/Squarebuzz.Data.Tests/Squarebuzz.Data.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=data.trx" --results-directory artifacts/test-results -- RunConfiguration.TreatNoTestsAsError=true

      - name: Test Presentation
        run: >
          dotnet test tests/Squarebuzz.Presentation.Tests/Squarebuzz.Presentation.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=presentation.trx" --results-directory artifacts/test-results -- RunConfiguration.TreatNoTestsAsError=true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results
          if-no-files-found: ignore

  # Validate puzzle data and resource files.
  content:
    name: Content
    runs-on: ubuntu-latest
    # Both file-based tools and their Core project reference are MAUI-free.
    env:
      MSBuildEnableWorkloadResolver: 'false'

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Translations match the neutral culture
        run: dotnet run tools/check-strings.cs

      - name: Every authored puzzle solves by pure line logic
        run: dotnet run tools/validate-puzzles.cs

  android:
    name: Android
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      # Install this platform's workloads from the workload set pinned in global.json.
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      # Select only the Android app target; referenced libraries retain net10.0.
      - name: Build APK
        run: >
          dotnet build src/Squarebuzz.App/Squarebuzz.App.csproj
          -c Release
          -p:SquarebuzzTargetFramework=net10.0-android

      - name: Upload APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-apk
          path: src/Squarebuzz.App/bin/Release/net10.0-android/*-Signed.apk
          if-no-files-found: warn

  apple:
    name: ${{ matrix.name }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            workload: maui-ios
            framework: net10.0-ios
            runtime: iossimulator-arm64
            code-signing: 'true'
          - name: Mac Catalyst
            workload: maui-maccatalyst
            framework: net10.0-maccatalyst
            runtime: maccatalyst-arm64
            code-signing: 'false'
    env:
      XCODE_VERSION: '26.6'

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      # Workload set 10.0.401 uses Apple SDK 26.5.10318. Keep Xcode aligned with its requirements.
      - name: Select pinned Xcode
        shell: bash
        run: |
          xcode_path="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$xcode_path" ]; then
            echo "::error::Required Xcode ${XCODE_VERSION} is missing from this runner."
            exit 1
          fi

          sudo xcode-select -s "$xcode_path"
          # Initialize SDK components before actool is needed; initialization failure is fatal.
          sudo xcodebuild -runFirstLaunch
          xcodebuild -version
          xcrun --sdk macosx --find actool
          xcrun --sdk iphonesimulator --show-sdk-path

      - name: Install MAUI workload
        run: dotnet workload install ${{ matrix.workload }}

      # Build iOS simulator and Mac Catalyst independently. These are compile checks, not deployment.
      - name: Build Apple target
        run: >
          dotnet build src/Squarebuzz.App/Squarebuzz.App.csproj
          -c Release
          -p:SquarebuzzTargetFramework=${{ matrix.framework }}
          -p:RuntimeIdentifier=${{ matrix.runtime }}
          -p:EnableCodeSigning=${{ matrix.code-signing }}
          -p:CodesignRequireProvisioningProfile=false

  # Check warnings from the MAUI Windows target as errors.
  app-warnings:
    name: App warnings
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Build with warnings as errors
        run: >
          dotnet build src/Squarebuzz.App/Squarebuzz.App.csproj
          -c Release
          -p:SquarebuzzTargetFramework=net10.0-windows10.0.19041.0
          -warnaserror
