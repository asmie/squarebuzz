name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Fast feedback: the domain, persistence and ViewModel layers reference no MAUI workload, so
  # they build and test in well under a minute. Run on both OSes because "Core runs anywhere" is
  # a design goal - and because the SQLite tests exercise a native library that differs per
  # platform. Presentation is here too: it targets plain net10.0 with only CommunityToolkit.Mvvm,
  # and its tests sat unrun by CI for as long as the job listed only Core and Data.
  domain:
    name: Domain, data & ViewModels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # These projects target plain net10.0; they do not need workload-set metadata or MAUI packs.
    env:
      MSBuildEnableWorkloadResolver: 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # One project per invocation: MSBuild takes a single project or solution argument and
      # rejects the second as an unknown switch (MSB1008). Restoring the solution instead is not
      # an option here - that would pull in the MAUI head, whose workloads this job does not
      # install on purpose.
      - name: Restore
        run: |
          dotnet restore tests/Squarebuzz.Core.Tests/Squarebuzz.Core.Tests.csproj
          dotnet restore tests/Squarebuzz.Data.Tests/Squarebuzz.Data.Tests.csproj
          dotnet restore tests/Squarebuzz.Presentation.Tests/Squarebuzz.Presentation.Tests.csproj

      - name: Build
        run: |
          dotnet build src/Squarebuzz.Core/Squarebuzz.Core.csproj -c Release --no-restore
          dotnet build src/Squarebuzz.Data/Squarebuzz.Data.csproj -c Release --no-restore
          dotnet build src/Squarebuzz.Presentation/Squarebuzz.Presentation.csproj -c Release --no-restore

      - name: Test
        run: |
          dotnet test tests/Squarebuzz.Core.Tests/Squarebuzz.Core.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=core.trx" --results-directory artifacts/test-results
          dotnet test tests/Squarebuzz.Data.Tests/Squarebuzz.Data.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=data.trx" --results-directory artifacts/test-results
          dotnet test tests/Squarebuzz.Presentation.Tests/Squarebuzz.Presentation.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=presentation.trx" --results-directory artifacts/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test-results
          if-no-files-found: ignore

  # Run both content validators so edits cannot ship puzzles that need guessing or translations
  # with missing keys. dotnet run builds and restores these file-based apps as needed;
  # validate-puzzles.cs declares a Core project reference through its #:project directive.
  content:
    name: Content
    runs-on: ubuntu-latest
    # Both file-based tools and their Core project reference are MAUI-free.
    env:
      MSBuildEnableWorkloadResolver: 'false'

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Translations match the neutral culture
        run: dotnet run tools/check-strings.cs

      - name: Every authored puzzle solves by pure line logic
        run: dotnet run tools/validate-puzzles.cs

  android:
    name: Android
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Install this platform's workloads from the workload set pinned in global.json.
      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      # TargetFrameworks is overridden rather than passing -f, because restore covers every
      # framework a project declares regardless of which one is being built. With the four in
      # Squarebuzz.App.csproj that means restore alone would demand the iOS, Mac Catalyst and
      # Windows workloads this job deliberately does not install, and fail with NETSDK1147.
      # A command-line property is global, so the csproj cannot append Windows back onto it.
      - name: Build APK
        run: >
          dotnet build src/Squarebuzz.App/Squarebuzz.App.csproj
          -c Release
          -p:SquarebuzzTargetFramework=net10.0-android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src/Squarebuzz.App/bin/Release/net10.0-android/*-Signed.apk
          if-no-files-found: warn

  apple:
    name: ${{ matrix.name }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            workload: maui-ios
            framework: net10.0-ios
            runtime: iossimulator-arm64
            code-signing: 'true'
          - name: Mac Catalyst
            workload: maui-maccatalyst
            framework: net10.0-maccatalyst
            runtime: maccatalyst-arm64
            code-signing: 'false'
    env:
      XCODE_VERSION: '26.6'

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # Workload set 10.0.400 contains Apple SDKs 26.5.10301, which require Xcode 26.6.
      # Keep this selection in sync with global.json and the README toolchain requirements.
      - name: Select pinned Xcode
        shell: bash
        run: |
          xcode_path="/Applications/Xcode_${XCODE_VERSION}.app"
          if [ ! -d "$xcode_path" ]; then
            echo "::error::Required Xcode ${XCODE_VERSION} is missing from this runner."
            exit 1
          fi

          sudo xcode-select -s "$xcode_path"
          # Initialize SDK components before actool is needed; initialization failure is fatal.
          sudo xcodebuild -runFirstLaunch
          xcodebuild -version
          xcrun --sdk macosx --find actool
          xcrun --sdk iphonesimulator --show-sdk-path

      - name: Install MAUI workload
        run: dotnet workload install ${{ matrix.workload }}

      # Compile both Apple heads independently so a failure in one does not skip the other.
      # iOS uses the simulator; Mac Catalyst disables signing for this compile check. Neither
      # needs a distribution identity or provisioning profile, and neither build is published.
      - name: Build Apple target
        run: >
          dotnet build src/Squarebuzz.App/Squarebuzz.App.csproj
          -c Release
          -p:SquarebuzzTargetFramework=${{ matrix.framework }}
          -p:RuntimeIdentifier=${{ matrix.runtime }}
          -p:EnableCodeSigning=${{ matrix.code-signing }}
          -p:CodesignRequireProvisioningProfile=false

  # Analysers run as errors in Core and Data, so a warning there already fails those jobs. This
  # catches anything the MAUI head reports, which is built with warnings-as-errors relaxed.
  app-warnings:
    name: App warnings
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install MAUI Windows workload
        run: dotnet workload install maui-windows

      - name: Build with warnings as errors
        run: >
          dotnet build src/Squarebuzz.App/Squarebuzz.App.csproj
          -c Release
          -p:SquarebuzzTargetFramework=net10.0-windows10.0.19041.0
          -warnaserror
